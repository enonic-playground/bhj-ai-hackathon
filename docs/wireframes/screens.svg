<svg xmlns="http://www.w3.org/2000/svg" width="776" height="1436" viewBox="0 0 776 1436" role="img" aria-label="Hac-Man title, level complete, game over and campaign complete screens"><title>Hac-Man title, level complete, game over and campaign complete screens</title><g font-family="Arial, sans-serif">
